pipeline:
  name: python-function-app
  identifier: python_function_app
  orgIdentifier: default
  projectIdentifier: ourfamily
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: github_connector
        build: <+input>
  variables:
    - name: resource_group
      type: String
      value: functiontest_group
    - name: dev_function_app
      type: String
      value: functiontest
    - name: prod_function_app
      type: String
      value: ""
  stages:
    - stage:
        name: Build Test Deploy Dev
        identifier: build_test_deploy_dev
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            paths:
              - /root/.cache/pip
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Unit Tests
                  identifier: unit_tests
                  spec:
                    connectorRef: docker_hub
                    image: python:3.11-slim
                    shell: Sh
                    command: |
                      set -e
                      pip install -r requirements-dev.txt
                      python -m pytest -q --junitxml=reports/junit.xml
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - reports/junit.xml
              - step:
                  type: Run
                  name: Package
                  identifier: package
                  spec:
                    connectorRef: docker_hub
                    image: python:3.11-slim
                    shell: Sh
                    command: |
                      set -e
                      apt-get update -qq && apt-get install -y -qq zip >/dev/null
                      rm -rf .python_packages dist && mkdir -p dist
                      pip install -r requirements.txt --target=".python_packages/lib/site-packages"
                      python -c 'import sys;print("%d.%d"%sys.version_info[:2])' > dist/pyversion
                      zip -qr dist/functionapp.zip . -x@.zipignore
                      ls -lh dist/functionapp.zip
              - step:
                  type: Run
                  name: Deploy Dev
                  identifier: deploy_dev
                  spec:
                    connectorRef: docker_hub
                    image: mcr.microsoft.com/azure-cli:latest
                    shell: Bash
                    envVariables:
                      AZURE_CLIENT_ID: <+secrets.getValue("azure_client_id")>
                      AZURE_CLIENT_SECRET: <+secrets.getValue("azure_client_secret")>
                      AZURE_TENANT_ID: <+secrets.getValue("azure_tenant_id")>
                      AZURE_SUBSCRIPTION_ID: <+secrets.getValue("azure_subscription_id")>
                      RG: <+pipeline.variables.resource_group>
                      APP: <+pipeline.variables.dev_function_app>
                      APP_VERSION: <+codebase.shortCommitSha>
                    command: |
                      set -euo pipefail
                      bash scripts/deploy.sh dev
          sharedPaths:
            - /root/.cache/pip
    - stage:
        name: Approve Prod
        identifier: approve_prod
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Prod Approval
                  identifier: prod_approval
                  timeout: 1d
                  spec:
                    approvalMessage: Dev deploy of <+codebase.shortCommitSha> passed. Promote to prod?
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
        when:
          pipelineStatus: Success
          condition: <+codebase.branch> == "main" && <+pipeline.variables.prod_function_app> != ""
    - stage:
        name: Deploy Prod
        identifier: deploy_prod
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Package
                  identifier: package_prod
                  spec:
                    connectorRef: docker_hub
                    image: python:3.11-slim
                    shell: Sh
                    command: |
                      set -e
                      apt-get update -qq && apt-get install -y -qq zip >/dev/null
                      rm -rf .python_packages dist && mkdir -p dist
                      pip install -r requirements.txt --target=".python_packages/lib/site-packages"
                      python -c 'import sys;print("%d.%d"%sys.version_info[:2])' > dist/pyversion
                      zip -qr dist/functionapp.zip . -x@.zipignore
              - step:
                  type: Run
                  name: Deploy Prod
                  identifier: deploy_prod_step
                  spec:
                    connectorRef: docker_hub
                    image: mcr.microsoft.com/azure-cli:latest
                    shell: Bash
                    envVariables:
                      AZURE_CLIENT_ID: <+secrets.getValue("azure_client_id")>
                      AZURE_CLIENT_SECRET: <+secrets.getValue("azure_client_secret")>
                      AZURE_TENANT_ID: <+secrets.getValue("azure_tenant_id")>
                      AZURE_SUBSCRIPTION_ID: <+secrets.getValue("azure_subscription_id")>
                      RG: <+pipeline.variables.resource_group>
                      APP: <+pipeline.variables.prod_function_app>
                      APP_VERSION: <+codebase.shortCommitSha>
                    command: |
                      set -euo pipefail
                      bash scripts/deploy.sh prod
        when:
          pipelineStatus: Success
          condition: <+codebase.branch> == "main" && <+pipeline.variables.prod_function_app> != ""
